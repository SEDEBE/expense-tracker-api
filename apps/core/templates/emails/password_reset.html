{% extends "emails/base.html" %}
{% block content %}
  <p style="margin:0; font-size:22px; line-height:1.3; font-weight:600; letter-spacing:-0.01em;">{{ subject }}</p>
  <p style="margin:16px 0 0; font-size:15px; line-height:1.6;">{{ intro }}</p>

  <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:24px;">
    <tr>
      <td style="background:#1d1f20; border-radius:6px;">
        <a href="{{ button_url }}" style="display:inline-block; padding:11px 18px; font-size:14px; font-weight:600; color:#ffffff; text-decoration:none;">{{ button_label }}</a>
      </td>
    </tr>
  </table>

  <p style="margin:24px 0 0; font-size:14px; line-height:1.6; color:#5f6368;">{{ expiry }}</p>
  <p style="margin:16px 0 0; font-size:12px; line-height:1.5; color:#5f6368;">
    {{ fallback }}<br />
    <a href="{{ button_url }}" style="color:#5f6368; word-break:break-all;">{{ button_url }}</a>
  </p>
{% endblock %}
