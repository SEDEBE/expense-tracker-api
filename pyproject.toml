[project]
name = "expense-tracker-api"
version = "0.1.0"
description = "REST API to track personal expenses, built with Django and Django REST Framework."
authors = [
    { name = "Alejandro Córdoba", email = "alejandrocordoba28@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<6.2",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "-ra --reuse-db"
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["**/migrations/*", "**/tests/*", "config/settings/*", "config/wsgi.py", "config/asgi.py"]
