name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel older runs of the same branch when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: expenses
          POSTGRES_USER: expenses
          POSTGRES_PASSWORD: expenses
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
      DATABASE_URL: postgres://expenses:expenses@localhost:5432/expenses
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Compile translations
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
          uv run python manage.py compilemessages --ignore=.venv
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Check production settings
        env:
          ALLOWED_HOSTS: api.example.com
        run: uv run python manage.py check --deploy --settings=config.settings.prod --fail-level WARNING
      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Pull requests only build the image; pushes to main also publish it to GHCR.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs only once the server exists: set the DEPLOY_HOST and DEPLOY_USER repository
  # variables and the DEPLOY_SSH_KEY secret (see SEDEBE/portfolio-infra).
  deploy:
    if: github.event_name == 'push' && vars.DEPLOY_HOST != ''
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - name: Pull the new image and restart the API, worker and beat
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: ~/portfolio-infra/deploy.sh api worker beat
